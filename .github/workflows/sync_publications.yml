name: Sync Publications and Grants

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Publications & Grants
        run: python scripts/build_research_outputs.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.html in_ORCID_now.json conference_abstracts_only.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync publications & grants" && git push)

- name: Fetch member photos from WordPress
        run: python scripts/fetch_photos.py

      - name: Commit photos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/img/*.jpg
          git diff --staged --quiet || (git commit -m "Add downloaded lab member headshots" && git push)
